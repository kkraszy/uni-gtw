name: Build Firmware

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: main/web

      - name: TypeScript type check
        run: pnpm run typecheck
        working-directory: main/web

      - name: Lint (oxlint)
        run: pnpm run lint
        working-directory: main/web

      - name: Format check (oxfmt)
        run: pnpm run fmt:check
        working-directory: main/web

  build:
    runs-on: ubuntu-latest
    container: ghcr.io/alufers/esp-builder-builder-docker:latest

    strategy:
      matrix:
        preset:
          - default # esp32c3
          - esp32
          - esp32s3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-tags: true # to make git describe work
          fetch-depth: 0

      - name: Add the repo path to safe.directory
        run: git config --global --add safe.directory $PWD
      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py --version
          idf.py --preset ${{ matrix.preset }} build

      - name: Extract build info
        id: build-info
        run: |
          DESC=$(find build -maxdepth 2 -name project_description.json | grep -v bootloader | head -1)
          TARGET=$(python3 -c "import json; d=json.load(open('$DESC')); print(d['target'])")
          VERSION=$(python3 -c "import json; d=json.load(open('$DESC')); print(d['project_version'])")
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package binaries
        run: uv run tools/package_binaries.py

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: uni-gtw-binaries-${{ steps.build-info.outputs.target }}-${{ steps.build-info.outputs.version }}
          path: build/packaged-binaries/

  combine:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: uni-gtw-binaries-*
          path: downloaded-artifacts/

      - name: List downloaded artifacts
        run: find downloaded-artifacts -mindepth 1 -maxdepth 2 | sort

      - name: Merge packaged binaries
        run: |
          python3 tools/merge_packaged_binaries.py \
            downloaded-artifacts/*/ \
            -o combined-binaries/

      - name: Extract version
        id: version
        run: |
          VERSION=$(python3 -c "import json; m=json.load(open('combined-binaries/esp_web_tools_manifest.json')); print(m['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: uni-gtw-combined-${{ steps.version.outputs.version }}
          path: combined-binaries/

      - name: Create release zip
        if: github.ref_type == 'tag'
        run: |
          cd combined-binaries
          zip -r ../uni-gtw-${{ github.ref_name }}.zip .

      - name: Attach files to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create release if it does not exist yet
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            || true

          # Attach the full zip
          gh release upload ${{ github.ref_name }} \
            uni-gtw-${{ github.ref_name }}.zip \
            --clobber

          # Attach individual app (OTA-flashable) binaries listed in app_binaries.txt
          while IFS= read -r bin; do
            [ -z "$bin" ] && continue
            gh release upload ${{ github.ref_name }} \
              "combined-binaries/$bin" \
              --clobber
          done < combined-binaries/app_binaries.txt
