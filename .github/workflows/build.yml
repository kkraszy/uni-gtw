name: Build Firmware

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: main/web

      - name: TypeScript type check
        run: pnpm run typecheck
        working-directory: main/web

      - name: Lint (oxlint)
        run: pnpm run lint
        working-directory: main/web

      - name: Format check (oxfmt)
        run: pnpm run fmt:check
        working-directory: main/web

  build:
    runs-on: ubuntu-latest
    container: ghcr.io/alufers/esp-builder-builder-docker:latest

    strategy:
      matrix:
        preset:
          - default # esp32c3
          - esp32
          - esp32s3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py --version
          idf.py --preset ${{ matrix.preset }} build

      - name: Extract build info
        id: build-info
        run: |
          DESC=$(find build -maxdepth 2 -name project_description.json | grep -v bootloader | head -1)
          TARGET=$(python3 -c "import json; d=json.load(open('$DESC')); print(d['target'])")
          VERSION=$(python3 -c "import json; d=json.load(open('$DESC')); print(d['project_version'])")
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package binaries
        run: uv run tools/package_binaries.py

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: uni-gtw-binaries-${{ steps.build-info.outputs.target }}-${{ steps.build-info.outputs.version }}
          path: build/packaged-binaries/
